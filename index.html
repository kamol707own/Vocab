<style>
/* Layout: category sidebar (chips on phones) + one working area with List / Cards / Quiz / Listening.
   Cards, Quiz and Listening fit one screen (html.fit): nothing scrolls. No scrollbar is ever drawn.
   Each topic group owns one soft tint; word cards, chips and tabs take it from data-g. */
:root{
  --bg:#f4f6f9; --surface:#ffffff; --fg:#1c2230; --muted:#5d6678; --line:#dde2ea;
  --accent:#3f56c4; --accent-ink:#ffffff;
  --ok-bg:#dff3e5; --ok-ink:#1f6a3a; --bad-bg:#fbe3e6; --bad-ink:#9a2d40;
  --time-bg:#e4edfa; --time-ink:#274a82; --time-ac:#6c93d6;
  --num-bg:#fbe6eb;  --num-ink:#8a3349;  --num-ac:#da8a9d;
  --desc-bg:#fbf0d3; --desc-ink:#715410; --desc-ac:#d6ae44;
  --act-bg:#e0f2e5;  --act-ink:#276539;  --act-ac:#6bb380;
  --gram-bg:#ebe6f8; --gram-ink:#4f3b8c; --gram-ac:#9883d6;
  --life-bg:#fde8da; --life-ink:#84451f; --life-ac:#e29d6f;
  --kr:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --ui:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11141b; --surface:#191d27; --fg:#e7eaf1; --muted:#9aa3b6; --line:#2a3041;
    --accent:#93a5f2; --accent-ink:#11141b;
    --ok-bg:#1c3326; --ok-ink:#a6dbb7; --bad-bg:#3b1f27; --bad-ink:#f0b3bf;
    --time-bg:#1d2a43; --time-ink:#b5cdf3; --time-ac:#6c93d6;
    --num-bg:#3a2029;  --num-ink:#f0bcc8;  --num-ac:#da8a9d;
    --desc-bg:#38301a; --desc-ink:#eed48a; --desc-ac:#d6ae44;
    --act-bg:#1c3425;  --act-ink:#a8dcb8;  --act-ac:#6bb380;
    --gram-bg:#2a2442; --gram-ink:#cabef0; --gram-ac:#9883d6;
    --life-bg:#3a2819; --life-ink:#f2c3a1; --life-ac:#e29d6f;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11141b; --surface:#191d27; --fg:#e7eaf1; --muted:#9aa3b6; --line:#2a3041;
  --accent:#93a5f2; --accent-ink:#11141b;
  --ok-bg:#1c3326; --ok-ink:#a6dbb7; --bad-bg:#3b1f27; --bad-ink:#f0b3bf;
  --time-bg:#1d2a43; --time-ink:#b5cdf3; --time-ac:#6c93d6;
  --num-bg:#3a2029;  --num-ink:#f0bcc8;  --num-ac:#da8a9d;
  --desc-bg:#38301a; --desc-ink:#eed48a; --desc-ac:#d6ae44;
  --act-bg:#1c3425;  --act-ink:#a8dcb8;  --act-ac:#6bb380;
  --gram-bg:#2a2442; --gram-ink:#cabef0; --gram-ac:#9883d6;
  --life-bg:#3a2819; --life-ink:#f2c3a1; --life-ac:#e29d6f;
  color-scheme:dark;
}
[data-g="time"]{--gbg:var(--time-bg);--gink:var(--time-ink);--gac:var(--time-ac)}
[data-g="num"]{--gbg:var(--num-bg);--gink:var(--num-ink);--gac:var(--num-ac)}
[data-g="desc"]{--gbg:var(--desc-bg);--gink:var(--desc-ink);--gac:var(--desc-ac)}
[data-g="act"]{--gbg:var(--act-bg);--gink:var(--act-ink);--gac:var(--act-ac)}
[data-g="gram"]{--gbg:var(--gram-bg);--gink:var(--gram-ink);--gac:var(--gram-ac)}
[data-g="life"]{--gbg:var(--life-bg);--gink:var(--life-ink);--gac:var(--life-ac)}

/* scrolling still works, scrollbars are never drawn */
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none;width:0;height:0}

*{box-sizing:border-box}
html.fit,html.fit body{height:100%;overflow:hidden}
body{
  background:var(--bg);color:var(--fg);font:15px/1.5 var(--ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:22px 56px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
/* smooth press feedback on every button (transform only, so nothing shifts or jumps) */
.btn,.opt,.tab,.nv,.ib,.tbtn,.chip,.spk{transition:transform .12s ease,background-color .2s ease,border-color .2s ease,color .2s ease,box-shadow .2s ease,opacity .2s ease}
.btn:active,.opt:active:not(:disabled),.tab:active,.nv:active,.ib:active,.tbtn:active,.chip:active,.spk:active{transform:scale(.96)}
/* game screens fade/slide in instead of snapping (list stays instant, so search typing never lags) */
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fc-wrap,.qz{animation:viewIn .28s cubic-bezier(.22,.8,.3,1) both}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1220px;margin:0 auto;display:grid;grid-template-columns:268px minmax(0,1fr);gap:8px 30px;align-items:start}
html.fit .app{height:100%;grid-template-rows:auto minmax(0,1fr)}

/* header */
.top{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 28px;padding-bottom:18px}
.top h1{margin:0;font-size:1.65rem;line-height:1.15;letter-spacing:-.02em;text-wrap:balance}
.top-r{display:flex;align-items:flex-end;gap:16px;flex:0 1 auto;min-width:0}
.tbtn{width:42px;height:42px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--fg);display:grid;place-items:center;padding:0}
@media (hover:hover){.tbtn:hover{border-color:var(--accent)}}
.tbtn .sun{display:none}
.tbtn[data-eff="dark"] .sun{display:block}
.tbtn[data-eff="dark"] .moon{display:none}
.prog{min-width:min(280px,100%);flex:0 1 340px}
.prog-row{display:flex;justify-content:space-between;gap:12px;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.prog-row b{color:var(--fg);font-weight:600}
.bar-bg{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.bar-fg{height:100%;width:0;border-radius:99px;background:var(--accent);transition:width .35s}

/* nav */
nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);max-height:calc(100vh - 32px);overflow:auto;padding-right:4px;display:flex;flex-direction:column;gap:14px;align-self:start}
.grp{display:flex;flex-direction:column;gap:2px}
.grp-h{display:flex;align-items:center;gap:8px;font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 10px 4px}
.grp-h i{width:10px;height:10px;border-radius:3px;background:var(--gac)}
.nv{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;border-radius:10px;padding:8px 10px;color:var(--fg)}
@media (hover:hover){.nv:hover{background:var(--surface)}}
.nv .dot{width:9px;height:9px;border-radius:50%;background:var(--gac);flex:none}
.nv .nn{flex:1;min-width:0}
.nv .nc{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.nv[aria-current="true"]{background:var(--gbg);color:var(--gink);font-weight:600}
.nv[aria-current="true"] .nc{color:var(--gink)}
.nv.all{font-weight:600;background:var(--surface);border:1px solid var(--line)}
.nv.all[aria-current="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.nv.all[aria-current="true"] .nc{color:var(--accent-ink)}

/* main */
main{min-width:0;display:flex;flex-direction:column;gap:14px}
html.fit main{min-height:0}
html.fit #view{flex:1;min-height:0;display:flex;flex-direction:column}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 18px;font-weight:600;font-size:.9rem}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tab .ti{display:none}

/* controls */
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctl input[type=search]{flex:1 1 220px;max-width:360px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px}
.chip,.ctl label,.ctl select{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:.82rem;font-weight:600;cursor:pointer;position:relative;white-space:nowrap}
.ctl label input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.ctl label:has(input:checked),.chip[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent);border-color:transparent}
.ctl label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.ctl select{padding-right:10px}
.scope{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.scope b{color:var(--fg)}

/* list: thin one-line rows */
.cat{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.cat+.cat{margin-top:20px}
.cat h2{margin:0;display:flex;align-items:center;gap:10px;font-size:1.05rem}
.cat h2 .pill{background:var(--gbg);color:var(--gink);border-radius:999px;padding:3px 12px;font-size:.78rem;font-weight:600}
.cat h2 .cnt{font-size:.8rem;font-weight:500;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:8px}
.w{background:var(--gbg);color:var(--gink);border-radius:12px;padding:6px 8px 6px 14px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) auto;align-items:center;gap:2px 12px;min-width:0;transition:opacity .2s}
.w .ex{grid-column:1/-1;padding-bottom:4px}
.kr{font:500 1.2rem/1.3 var(--kr);overflow-wrap:anywhere}
.uz{font-weight:600;font-size:.92rem;overflow-wrap:anywhere}
.ex{font-size:.8rem;opacity:.8;overflow-wrap:anywhere}
.tools{display:flex;gap:4px;flex:none}
.ib{width:32px;height:32px;border-radius:50%;border:1px solid color-mix(in srgb,var(--gink) 25%,transparent);background:color-mix(in srgb,var(--surface) 55%,transparent);display:grid;place-items:center;padding:0;font-size:.85rem;color:var(--gink)}
@media (hover:hover){.ib:hover{background:var(--surface)}}
.chk[aria-pressed="true"]{background:var(--gink);color:var(--gbg);border-color:var(--gink)}
.w.is-known{opacity:.62}
.hide-uz .w:not(.show) .uz,.hide-uz .w:not(.show) .ex{filter:blur(7px);user-select:none}
.hide-uz .w:not(.show){cursor:pointer}
.empty{padding:28px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px}

/* game screens: one centered column, sized to fit */
.fc-wrap,.qz{flex:1;min-height:0;min-width:0;width:100%;max-width:520px;margin-inline:auto;display:flex;flex-direction:column;justify-content:center;gap:12px}
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:32px;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.hud b{color:var(--fg);font-weight:600}
.chip.sm{min-height:32px;padding:4px 12px;font-size:.78rem}

/* flashcards */
.fc-card{flex:0 1 clamp(230px,48vh,420px);min-height:0;width:100%;border:0;border-radius:24px;background:var(--gbg);color:var(--gink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center;overflow:hidden}
.fc-big{font:500 clamp(1.9rem,8vw,3.2rem)/1.2 var(--kr);overflow-wrap:anywhere}
.fc-big.uz-big{font-family:var(--ui);font-weight:700;font-size:clamp(1.4rem,5.5vw,2.1rem)}
.fc-big.small{font-size:1.6rem}
.fc-card .ex{font-size:.9rem}
.fc-btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%}
.fc-btns.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 8px;font-weight:600;min-height:50px;min-width:0}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ok{background:var(--ok-bg);color:var(--ok-ink);border-color:transparent}
.btn.bad{background:var(--bad-bg);color:var(--bad-ink);border-color:transparent}

/* quiz + listening */
.qz-q{flex:0 1 clamp(200px,36vh,330px);min-height:0;background:var(--gbg);color:var(--gink);border-radius:24px;padding:16px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;overflow:hidden}
.qz-opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(72px,auto);gap:10px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:10px 12px;text-align:center;font-weight:600;font-size:1rem;line-height:1.25;overflow-wrap:anywhere;display:grid;place-items:center}
.opt.kro{font:500 1.2rem/1.25 var(--kr)}
@media (hover:hover){.opt:hover:not(:disabled){border-color:var(--accent)}}
.opt.right{background:var(--ok-bg);color:var(--ok-ink);border-color:transparent}
.opt.wrong{background:var(--bad-bg);color:var(--bad-ink);border-color:transparent}
.opt:disabled{cursor:default;color:var(--fg)}
.opt.right:disabled{color:var(--ok-ink)}
.opt.wrong:disabled{color:var(--bad-ink)}
.spk{width:88px;height:88px;border-radius:50%;border:0;background:color-mix(in srgb,var(--gink) 14%,transparent);color:var(--gink);display:grid;place-items:center;padding:0}
.spk:active{transform:scale(.96)}
.score{font-size:2.4rem;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.wrong-list{display:grid;gap:6px;margin:0;padding:0;list-style:none;width:100%;max-width:420px}
.wrong-list li{background:color-mix(in srgb,var(--surface) 60%,transparent);border-radius:10px;padding:6px 12px;display:flex;justify-content:space-between;gap:10px;text-align:left}
.wrong-list .kr{font-size:1.05rem}

@media (max-width:820px){

  html.fit .app{position:fixed;top:env(safe-area-inset-top,0px);bottom:calc(84px + env(safe-area-inset-bottom,0px));left:0;right:0;width:auto;max-width:none;height:auto;margin:0;display:flex;flex-direction:column;
    padding:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
  .top{padding-bottom:12px;align-items:center;gap:10px}
  html.fit .top{flex:none;padding-bottom:6px}
  .top h1{font-size:1.3rem;flex:1 1 0;min-width:0}
  .top-r{display:contents}
  .tbtn{order:1;width:44px;height:44px}
  .prog{order:2;flex:1 1 100%}
  html.fit .prog{display:none}

  /* category chips pinned under the status bar */
  nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);align-self:stretch;min-width:0;max-height:none;overflow-x:auto;overflow-y:hidden;flex-direction:row;gap:8px;
    margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
    padding:8px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
    border-bottom:1px solid var(--line)}
  html.fit nav{position:static;flex:none;padding-top:4px;padding-bottom:8px}
  .grp{display:contents}
  .grp-h{display:none}
  .nv{width:auto;flex:none;white-space:nowrap;min-height:40px;border:0;border-radius:999px;padding:8px 15px;background:var(--gbg);color:var(--gink)}
  html.fit .nv{min-height:36px;padding:6px 14px}
  @media (hover:hover){.nv:hover{background:var(--gbg)}}
  .nv .dot,.nv .nc{display:none}
  .nv[aria-current="true"]{box-shadow:inset 0 0 0 2px var(--gink);font-weight:600}
  .nv.all{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
  .nv.all[aria-current="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:none}

  main{margin-top:12px;gap:10px;width:100%}
  html.fit main{flex:1;min-height:0;margin-top:8px}
  html.fit .scope{display:none}

  /* floating pill tab bar */
  .tabs{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));margin-inline:auto;max-width:400px;z-index:20;flex-wrap:nowrap;gap:2px;padding:6px;border-radius:999px;
    background:color-mix(in srgb,var(--surface) 78%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);
    border:1px solid color-mix(in srgb,var(--line) 80%,transparent);box-shadow:0 10px 30px rgba(15,20,40,.16),0 2px 6px rgba(15,20,40,.08)}

  .grid{grid-template-columns:minmax(0,1fr);gap:6px}
  .w{padding:4px 6px 4px 14px}

  .uz{font-size:.9rem}

}

/* ---------- parse ---------- */
const cats=[],all=[],catById={},byKey={};
(function(){
  let cur=null;
  DATA.split('\n').forEach(function(l){
    l=l.trim(); if(!l) return;
    if(l[0]==='#'){
      const p=l.slice(1).split('|');
      cur={id:'c'+cats.length,g:p[0],e:p[1],n:p[2],items:[]};
      cats.push(cur); catById[cur.id]=cur;
    }else{
      const p=l.split('|');
      const it={k:p[0],u:p[1],x:p[3]||'',g:cur.g,c:cur.n,cid:cur.id,key:cur.id+'/'+p[0]};
      cur.items.push(it); all.push(it); byKey[it.key]=it;
    }
  });
})();

/* ---------- my words (JSON import, saved on this device) ---------- */
let extra=[];
try{extra=JSON.parse(localStorage.getItem('kvw-custom')||'[]')||[]}catch(e){extra=[]}
function saveCustom(){try{localStorage.setItem('kvw-custom',JSON.stringify(extra))}catch(e){}}
function mergeCustom(){
  if(!extra.length) return;
  let c=catById['custom'];
  if(!c){c={id:'custom',g:'life',e:'⭐',n:"Mening so'zlarim",items:[]};cats.push(c);catById['custom']=c}
  for(const it of extra){
    if(byKey[it.key]) continue;
    c.items.push(it);all.push(it);byKey[it.key]=it;
  }
}
mergeCustom();

/* ---------- state ---------- */
let known={};
try{known=JSON.parse(localStorage.getItem('kvw-known')||'{}')||{}}catch(e){known={}}
function save(){try{localStorage.setItem('kvw-known',JSON.stringify(known))}catch(e){}}
const state={view:'list',cat:'all',q:'',hideUz:false,onlyUnknown:false,shuffle:false,dir:'kr',auto:true};
try{if(localStorage.getItem('kvw-auto')==='0') state.auto=false}catch(e){}
let fc={deck:[],i:0,flip:false};
let qz=null,timer=null;

const $=function(s){return document.querySelector(s)};
const esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a}

/* ---------- sound ---------- */
let koVoice=null;
function pickVoice(){
  try{
    koVoice=null;
    const vs=window.speechSynthesis.getVoices();
    for(let i=0;i<vs.length;i++){if(/^ko/i.test(vs[i].lang)){koVoice=vs[i];break}}
  }catch(e){}
}
try{if(window.speechSynthesis){pickVoice();window.speechSynthesis.onvoiceschanged=pickVoice}}catch(e){}
function speak(t){
  try{
    const s=window.speechSynthesis; if(!s) return;
    s.cancel();
    const u=new SpeechSynthesisUtterance(t.replace(/\(.*?\)/g,'').replace(/[↔\/]/g,' '));
    u.lang='ko-KR';u.rate=.85;
    if(koVoice) u.voice=koVoice;
    s.speak(u);
  }catch(e){}
}
function autoSpeak(t){if(state.auto) speak(t)}
function soundBtn(){
  return '<button class="chip sm" data-act="sound" aria-pressed="'+state.auto+'">'+(state.auto?'🔊 Avto':'🔈 Qo\'lda')+'</button>';
}

function scopeItems(){return state.cat==='all'?all:catById[state.cat].items}
function knownCount(items){let n=0;for(const it of items) if(known[it.key]) n++;return n}

/* ---------- nav + progress ---------- */
function renderNav(){
  let h='<button class="nv all" data-act="cat" data-c="all" aria-current="'+(state.cat==='all')+'"><span class="nn">Barcha so\'zlar</span><span class="nc">'+knownCount(all)+'/'+all.length+'</span></button>';
  for(const g in GROUPS){
    const list=cats.filter(function(c){return c.g===g});
    h+='<div class="grp" data-g="'+g+'"><div class="grp-h"><i></i>'+GROUPS[g]+'</div>';
    for(const c of list){
      h+='<button class="nv" data-g="'+g+'" data-act="cat" data-c="'+c.id+'" aria-current="'+(state.cat===c.id)+'"><span class="dot"></span><span class="nn">'+c.e+' '+esc(c.n)+'</span><span class="nc">'+knownCount(c.items)+'/'+c.items.length+'</span></button>';
    }
    h+='</div>';
  }
  const nv=$('#nav'),sl=nv.scrollLeft,st=nv.scrollTop;
  nv.innerHTML=h;nv.scrollLeft=sl;nv.scrollTop=st;
}
function renderProgress(){
  const k=knownCount(all),t=all.length,p=t?Math.round(k*100/t):0;
  $('#pk').textContent=k;$('#pt').textContent=t;$('#pp').textContent=p+'%';$('#pb').style.width=p+'%';
}
function renderScope(){
  const items=scopeItems();
  const name=state.cat==='all'?'Barcha so\'zlar':catById[state.cat].n;
  $('#scope').innerHTML='<b>'+esc(name)+'</b> · '+knownCount(items)+'/'+items.length+' yodlangan';
}

/* ---------- list ---------- */
function card(it){
  const k=!!known[it.key];
  return '<article class="w'+(k?' is-known':'')+'" data-key="'+esc(it.key)+'"><span class="kr" lang="ko">'+esc(it.k)+'</span><span class="uz">'+esc(it.u)+'</span><span class="tools"><button class="ib" data-act="say" aria-label="Eshitish">🔊</button><button class="ib chk" data-act="know" aria-pressed="'+k+'" aria-label="Yodladim deb belgilash">✓</button></span>'
    +(it.x?'<div class="ex">'+esc(it.x)+'</div>':'')+'</article>';
}
function viewList(){
  const q=state.q.trim().toLowerCase();
  const list=state.cat==='all'?cats:[catById[state.cat]];
  let h='',total=0;
  for(const c of list){
    const items=c.items.filter(function(it){
      if(state.onlyUnknown&&known[it.key]) return false;
      if(!q) return true;
      return (it.k+' '+it.u+' '+it.x).toLowerCase().indexOf(q)>-1;
    });
    if(!items.length) continue;
    total+=items.length;
    h+='<section class="cat" data-g="'+c.g+'"><h2><span class="pill">'+c.e+' '+esc(c.n)+'</span><span class="cnt">'+items.length+' ta</span></h2><div class="grid">'+items.map(card).join('')+'</div></section>';
  }
  if(!total) h='<div class="empty">Hech narsa topilmadi.</div>';
  return '<div class="'+(state.hideUz?'hide-uz':'')+'" id="listwrap">'+h+'</div>';
}

/* ---------- flashcards ---------- */
function buildDeck(){
  let d=scopeItems().filter(function(it){return !(state.onlyUnknown&&known[it.key])});
  d=d.slice(); if(state.shuffle) shuffle(d);
  fc={deck:d,i:0,flip:false};
}
function cardSpeak(){
  const it=fc.deck[fc.i]; if(!it||state.view!=='cards') return;
  if((state.dir==='kr'&&!fc.flip)||(state.dir==='uz'&&fc.flip)) autoSpeak(it.k);
}
function fcGo(i){fc.i=Math.max(0,Math.min(fc.deck.length,i));fc.flip=false;renderView();cardSpeak()}
function viewCards(){
  if(!fc.deck.length) return '<div class="empty">Bu bo\'limda so\'z yo\'q.</div>';
  if(fc.i>=fc.deck.length){
    return '<div class="fc-wrap"><div class="fc-card" style="background:var(--surface);color:var(--fg)"><div class="score">'+fc.deck.length+'/'+fc.deck.length+'</div></div><div class="fc-btns"><button class="btn pri" data-act="restart">Qaytadan</button></div></div>';
  }
  const it=fc.deck[fc.i],kr=state.dir==='kr';
  const krBig='<div class="fc-big" lang="ko">'+esc(it.k)+'</div>';
  const uzBig='<div class="fc-big uz-big">'+esc(it.u)+'</div>';
  let content;
  if(!fc.flip) content=kr?krBig:uzBig;
  else content=(kr?uzBig:krBig)+(it.x?'<div class="ex">'+esc(it.x)+'</div>':'');
  return '<div class="fc-wrap" data-g="'+it.g+'">'
    +'<div class="hud"><span><b>'+(fc.i+1)+'</b> / '+fc.deck.length+'</span>'+soundBtn()+'</div>'
    +'<button class="fc-card" data-act="flip" aria-label="Kartani aylantirish">'+content+'</button>'
    +'<div class="fc-btns three"><button class="btn" data-act="prev" aria-label="Oldingi">←</button><button class="btn" data-act="say" aria-label="Eshitish">🔊</button><button class="btn" data-act="next" aria-label="Keyingi">→</button></div>'
    +'<div class="fc-btns"><button class="btn bad" data-act="again">Yana takror</button><button class="btn ok" data-act="gotit">Yodladim ✓</button></div>'
    +'</div>';
}

/* ---------- quiz + listening ---------- */
function mkQ(it,dir){
  const f=dir==='kr'?'u':'k';
  const ans=it[f];
  const seen=new Set([ans]),opts=[];
  const pools=[shuffle(scopeItems().slice()),shuffle(all.slice())];
  for(let p=0;p<pools.length;p++){
    for(const x of pools[p]){
      if(opts.length>=3) break;
      if(!seen.has(x[f])){seen.add(x[f]);opts.push(x[f])}
    }
  }
  return {it:it,dir:dir,ans:ans,opts:shuffle([ans].concat(opts))};
}
function startQuiz(){
  clearTimeout(timer);
  const dir=state.view==='listen'?'kr':state.dir;
  const pool=shuffle(scopeItems().slice()).slice(0,10);
  qz={mode:state.view,qs:pool.map(function(it){return mkQ(it,dir)}),i:0,score:0,picked:null,wrong:[]};
}
function qSpeak(){
  if(!qz||qz.i>=qz.qs.length) return;
  const q=qz.qs[qz.i];
  if(qz.mode==='listen'||q.dir==='kr') autoSpeak(q.it.k);
}
function viewQuiz(){
  const listen=state.view==='listen';
  if(listen&&!window.speechSynthesis) return '<div class="empty">Bu qurilmada ovoz funksiyasi yo\'q.</div>';
  if(!qz||!qz.qs.length) return '<div class="empty">So\'z topilmadi.</div>';
  if(qz.i>=qz.qs.length){
    const pct=Math.round(qz.score*100/qz.qs.length);
    let h='<div class="qz"><div class="qz-q" style="background:var(--surface);color:var(--fg)"><div class="score">'+qz.score+' / '+qz.qs.length+'</div><div>'+pct+'%</div>';
    if(qz.wrong.length){
      h+='<ul class="wrong-list">'+qz.wrong.slice(0,4).map(function(w){return '<li><span class="kr" lang="ko">'+esc(w.k)+'</span><span>'+esc(w.u)+'</span></li>'}).join('')+'</ul>';
      if(qz.wrong.length>4) h+='<div>+'+(qz.wrong.length-4)+'</div>';
    }
    return h+'</div><div class="fc-btns"><button class="btn pri" data-act="retry">Yangi o\'yin</button></div></div>';
  }
  const q=qz.qs[qz.i],it=q.it,done=qz.picked!==null;
  let prompt;
  if(listen){
    prompt='<button class="spk" data-act="replay" aria-label="Eshitish"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg></button>'
      +(done?'<div class="fc-big small" lang="ko">'+esc(it.k)+'</div>':'');
  }else if(q.dir==='kr'){
    prompt='<div class="fc-big" lang="ko">'+esc(it.k)+'</div><button class="ib" data-act="replay" aria-label="Eshitish">🔊</button>';
  }else{
    prompt='<div class="fc-big uz-big">'+esc(it.u)+'</div>';
  }
  const opts=q.opts.map(function(o,idx){
    let cls='opt'+(q.dir==='uz'?' kro':''),dis='';
    if(done){
      dis=' disabled';
      if(o===q.ans) cls+=' right'; else if(idx===qz.picked) cls+=' wrong';
    }
    return '<button class="'+cls+'" data-act="pick" data-i="'+idx+'"'+dis+'>'+esc(o)+'</button>';
  }).join('');
  return '<div class="qz" data-g="'+it.g+'"><div class="hud"><span><b>'+(qz.i+1)+'</b> / '+qz.qs.length+' · ✓ '+qz.score+'</span>'+soundBtn()+'</div><div class="qz-q">'+prompt+'</div><div class="qz-opts">'+opts+'</div></div>';
}

/* ---------- render ---------- */
function renderView(){
  const v=$('#view');
  v.innerHTML=state.view==='list'?viewList():state.view==='cards'?viewCards():viewQuiz();
}
function refresh(){
  clearTimeout(timer);
  const fit=state.view!=='list';
  document.documentElement.classList.toggle('fit',fit);
  $('#main').setAttribute('data-view',state.view);
  document.querySelectorAll('.tab').forEach(function(t){t.setAttribute('aria-selected',String(t.dataset.v===state.view))});
  document.querySelectorAll('[data-for]').forEach(function(el){el.hidden=el.dataset.for.split(' ').indexOf(state.view)<0});
  const ctl=$('.ctl');
  ctl.hidden=!Array.prototype.some.call(ctl.children,function(el){return !el.hidden});
  if(state.view==='cards') buildDeck();
  if(state.view==='quiz'||state.view==='listen') startQuiz();
  renderNav();renderProgress();renderScope();renderView();
  if(state.view==='cards') cardSpeak();
  if(state.view==='quiz'||state.view==='listen') qSpeak();
}
function afterKnow(){renderNav();renderProgress();renderScope();save()}

/* ---------- JSON word list: download / upload ---------- */
function ioMsg(t){const m=$('#ioMsg');if(!m) return;m.textContent=t;clearTimeout(m._t);m._t=setTimeout(function(){m.textContent=''},5000)}
function downloadJson(){
  const words=all.map(function(it){return {korean:it.k,uzbek:it.u,example:it.x||'',group:it.g,category:it.c}});
  const data={app:'korean-vocabulary-world',version:1,exportedAt:new Date().toISOString(),words:words,known:Object.keys(known)};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='korean-vocabulary-world.json';a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href)},2000);
  ioMsg('Saqlab olindi: '+words.length+' ta so\'z');
}
function importJson(file){
  if(!file) return;
  const r=new FileReader();
  r.onload=function(){
    let d,added=0,skipped=0;
    try{d=JSON.parse(r.result)}catch(e){ioMsg('Xato: fayl JSON emas');return}
    const list=Array.isArray(d)?d:(d&&Array.isArray(d.words)?d.words:null);
    if(!list){ioMsg('Xato: so\'zlar ro\'yxati topilmadi');return}
    for(const w of list){
      const k=String(w.korean||w.k||'').trim(),u=String(w.uzbek||w.u||'').trim();
      if(!k||!u){skipped++;continue}
      const key='custom/'+k;
      if(byKey[key]){skipped++;continue}
      extra.push({k:k,u:u,x:String(w.example||w.x||''),g:'life',c:"Mening so'zlarim",cid:'custom',key:key});
      added++;
    }
    if(d&&Array.isArray(d.known)) for(const kk of d.known) known[kk]=1;
    saveCustom();save();mergeCustom();refresh();
    ioMsg('Yuklandi: '+added+' ta yangi so\'z'+(skipped?' · o\'tkazib yuborildi: '+skipped:''));
  };
  r.readAsText(file);
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  const b=e.target.closest('[data-act]');
  if(!b){
    const w=e.target.closest('.hide-uz .w');
    if(w) w.classList.toggle('show');
    return;
  }
  const a=b.dataset.act;
  if(a==='view'){state.view=b.dataset.v;refresh();window.scrollTo({top:0,behavior:'smooth'});return}
  if(a==='cat'){
    state.cat=b.dataset.c;refresh();
    if(window.innerWidth<=820){
      window.scrollTo({top:0});
      const cur=$('#nav [aria-current="true"]');
      if(cur&&cur.scrollIntoView) cur.scrollIntoView({inline:'center',block:'nearest'});
    }
    return;
  }
  if(a==='sound'){
    state.auto=!state.auto;
    try{localStorage.setItem('kvw-auto',state.auto?'1':'0')}catch(err){}
    if(!state.auto){try{window.speechSynthesis.cancel()}catch(err){}}
    renderView();return;
  }
  if(a==='say'){
    const w=b.closest('.w');
    if(w) speak(byKey[w.dataset.key].k); else if(fc.deck[fc.i]) speak(fc.deck[fc.i].k);
    return;
  }
  if(a==='replay'){if(qz&&qz.qs[qz.i]) speak(qz.qs[qz.i].it.k);return}
  if(a==='know'){
    const w=b.closest('.w'),it=byKey[w.dataset.key];
    if(known[it.key]) delete known[it.key]; else known[it.key]=1;
    if(state.onlyUnknown){afterKnow();renderView()}
    else{
      const k=!!known[it.key];
      w.classList.toggle('is-known',k);b.setAttribute('aria-pressed',String(k));afterKnow();
    }
    return;
  }
  if(a==='flip'){fc.flip=!fc.flip;renderView();cardSpeak();return}
  if(a==='next'){fcGo(fc.i+1);return}
  if(a==='prev'){fcGo(fc.i-1);return}
  if(a==='gotit'||a==='again'){
    const it=fc.deck[fc.i];
    if(it){if(a==='gotit') known[it.key]=1; else delete known[it.key]}
    afterKnow();fcGo(fc.i+1);return;
  }
  if(a==='restart'){buildDeck();renderView();cardSpeak();return}
  if(a==='pick'){
    if(qz.picked!==null) return;
    const q=qz.qs[qz.i];qz.picked=+b.dataset.i;
    const ok=q.opts[qz.picked]===q.ans;
    if(ok) qz.score++; else qz.wrong.push(q.it);
    if(qz.mode==='quiz'&&q.dir==='uz') autoSpeak(q.it.k);
    renderView();
    timer=setTimeout(function(){qz.i++;qz.picked=null;renderView();qSpeak()},ok?900:1700);
    return;
  }
  if(a==='retry'){startQuiz();renderView();qSpeak();return}
});
$('#q').addEventListener('input',function(e){state.q=e.target.value;renderView()});
$('#hideUz').addEventListener('change',function(e){state.hideUz=e.target.checked;renderView()});
$('#onlyUnknown').addEventListener('change',function(e){state.onlyUnknown=e.target.checked;refresh()});
$('#shuffle').addEventListener('change',function(e){state.shuffle=e.target.checked;refresh()});
$('#dir').addEventListener('change',function(e){state.dir=e.target.value;refresh()});
$('#expJson').addEventListener('click',downloadJson);
$('#impJson').addEventListener('click',function(){$('#impFile').click()});
$('#impFile').addEventListener('change',function(e){importJson(e.target.files[0]);e.target.value=''});
document.addEventListener('keydown',function(e){
  if(state.view!=='cards'||e.target.matches('input,select')) return;
  if(e.key==='ArrowRight') fcGo(fc.i+1);
  else if(e.key==='ArrowLeft') fcGo(fc.i-1);
});

/* ---------- light / dark ---------- */
(function(){
  const root=document.documentElement,btn=$('#theme');
  const mq=window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)'):null;
  function eff(){
    const a=root.getAttribute('data-theme');
    if(a==='dark'||a==='light') return a;
    return mq&&mq.matches?'dark':'light';
  }
  function sync(){
    const e=eff();
    btn.dataset.eff=e;
    const label=e==='dark'?'Yorug\' rejimga o\'tish':'Qorong\'i rejimga o\'tish';
    btn.setAttribute('aria-label',label);btn.title=label;
  }
  try{const s=localStorage.getItem('kvw-theme');if(s==='dark'||s==='light') root.setAttribute('data-theme',s)}catch(e){}
  btn.addEventListener('click',function(){
    const n=eff()==='dark'?'light':'dark';
    root.setAttribute('data-theme',n);
    try{localStorage.setItem('kvw-theme',n)}catch(e){}
    sync();
  });
  if(mq&&mq.addEventListener) mq.addEventListener('change',sync);
  try{new MutationObserver(sync).observe(root,{attributes:true,attributeFilter:['data-theme']})}catch(e){}
  sync();
})();

/* ---------- swipe through flashcards ---------- */
(function(){
  let sx=null,sy=null;
  const v=$('#view');
  v.addEventListener('touchstart',function(e){
    if(state.view!=='cards'||!e.touches[0]) return;
    sx=e.touches[0].clientX;sy=e.touches[0].clientY;
  },{passive:true});
  v.addEventListener('touchend',function(e){
    if(sx===null) return;
    const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
    sx=null;
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5) fcGo(dx<0?fc.i+1:fc.i-1);
  },{passive:true});
})();

/* ---------- install as an app (PWA) ---------- */
(function(){
  if('serviceWorker' in navigator){
    window.addEventListener('load',function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
  const btn=$('#install'),hint=$('#installHint');
  let deferred=null;
  const isiOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e;btn.hidden=false});
  if(isiOS&&!window.navigator.standalone) btn.hidden=false;
  btn.addEventListener('click',function(){
    if(deferred){deferred.prompt();deferred=null;btn.hidden=true;return}
    if(isiOS&&hint){hint.hidden=false;return}
  });
})();

refresh();
